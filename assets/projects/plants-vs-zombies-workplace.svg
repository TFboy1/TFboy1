<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="224" viewBox="0 0 560 224" fill="none" role="img" aria-labelledby="title description">
  <title id="title">植物大战僵尸 · 职场版 · 守住下班自由</title>
  <desc id="description">在五天十关的办公室里种下植物，守住最后一分钟的下班自由。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="560" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1722"/><stop offset=".5" stop-color="#080e17"/><stop offset="1" stop-color="#10242a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6fff2"/><stop offset=".45" stop-color="#74f8ce"/><stop offset="1" stop-color="#259b88"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#203c45" stop-opacity=".85"/><stop offset=".55" stop-color="#0c1c27" stop-opacity=".95"/><stop offset="1" stop-color="#152e32"/>
    </linearGradient>
    <linearGradient id="fade-line"><stop stop-color="#74f8ce" stop-opacity="0"/><stop offset=".5" stop-color="#74f8ce"/><stop offset="1" stop-color="#74f8ce" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".85"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#74f8ce" stop-opacity=".2"/><stop offset=".45" stop-color="#2da78f" stop-opacity=".09"/><stop offset="1" stop-color="#74f8ce" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#203846" stroke-opacity=".3" stroke-width=".6"/></pattern>
    <pattern id="dust" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="white" opacity=".035"/><circle cx="5" cy="4" r=".35" fill="white" opacity=".025"/></pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="frame"><rect width="560" height="224" rx="24"/></clipPath>
    
  </defs>
  <style><![CDATA[
  text { font-family: 'Trebuchet MS', 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  .mono, .mono text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .display { font-family: 'Arial Black', 'Segoe UI', sans-serif; font-weight: 900; letter-spacing: -7px; }
  .spin, .reverse, .orbit { transform-box: fill-box; transform-origin: center; }
  .spin { animation: rotate 38s linear infinite; }
  .reverse { animation: rotate 54s linear infinite reverse; }
  .orbit { animation: rotate 16s linear infinite; }
  .float { animation: float 7s ease-in-out infinite; }
  .breathe { animation: breathe 5s ease-in-out infinite; }
  .twinkle { animation: twinkle 5s ease-in-out infinite; }
  .signal { animation: signal 3s ease-in-out infinite; }
  .eyes { animation: eyes 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow { stroke-dasharray: 12 88; animation: flow 3.2s linear infinite; }
  .flow-slow { stroke-dasharray: 4 96; animation: flow 6s linear infinite; }
  .sweep { animation: sweep 9s ease-in-out infinite; }
  .node-halo { animation: node 6.4s ease-in-out infinite; }
  .rise { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes breathe { 0%,100% { opacity:.36; } 50% { opacity:.8; } }
  @keyframes twinkle { 0%,100% { opacity:.18; } 50% { opacity:.85; } }
  @keyframes signal { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes eyes { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.12); } }
  @keyframes flow { to { stroke-dashoffset:-100; } }
  @keyframes sweep { 0%,35% { transform:translateX(-360px); opacity:0; } 42% { opacity:.7; } 70%,100% { transform:translateX(900px); opacity:0; } }
  @keyframes node { 0%,15%,65%,100% { opacity:.12; } 28%,45% { opacity:.95; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
    .rise { opacity:1; }
    .sweep { display:none; }
  }
]]></style>
  <g clip-path="url(#frame)">
    <rect width="560" height="224" fill="url(#background)"/>
    
      <rect width="560" height="224" fill="url(#grid)" opacity=".4"/>
      <ellipse cx="448" cy="114" rx="175" ry="170" fill="url(#aura)" class="breathe"/>
      <circle cx="161.5" cy="152.2" r="1.10" fill="#74f8ce" opacity="0.21" class="twinkle" style="animation-delay:-2.56s"/>
<circle cx="102.6" cy="98.9" r="1.54" fill="#edf7f7" opacity="0.56"/>
<circle cx="500.7" cy="204.7" r="1.00" fill="#edf7f7" opacity="0.38"/>
<circle cx="230.2" cy="63.3" r="1.57" fill="#edf7f7" opacity="0.63"/>
<circle cx="397.2" cy="46.6" r="0.60" fill="#74f8ce" opacity="0.55"/>
<circle cx="480.1" cy="155.6" r="1.64" fill="#edf7f7" opacity="0.62" class="twinkle" style="animation-delay:-2.48s"/>
<circle cx="394.9" cy="196.6" r="1.45" fill="#edf7f7" opacity="0.42"/>
<circle cx="534.9" cy="102.3" r="1.70" fill="#edf7f7" opacity="0.54"/>
<circle cx="512.4" cy="100.9" r="0.80" fill="#74f8ce" opacity="0.46"/>
<circle cx="296.7" cy="53.9" r="0.90" fill="#edf7f7" opacity="0.56"/>
<circle cx="351.1" cy="126.4" r="0.77" fill="#edf7f7" opacity="0.19" class="twinkle" style="animation-delay:-0.11s"/>
<circle cx="245.2" cy="205.2" r="1.03" fill="#edf7f7" opacity="0.16"/>
<circle cx="84.1" cy="129.2" r="0.63" fill="#74f8ce" opacity="0.53"/>
<circle cx="462.7" cy="51.8" r="1.73" fill="#edf7f7" opacity="0.38"/>
<circle cx="272.2" cy="80.7" r="1.50" fill="#edf7f7" opacity="0.20"/>
      <path d="M330 1L290 223M347 1L307 223" stroke="#74f8ce" stroke-opacity=".04"/>
      <text x="28" y="33" font-size="10" fill="#74f8ce" class="mono" letter-spacing="1.4">PLAY / EXPLORE</text>
      <text x="532" y="33" font-size="11" fill="#91a9b8" class="mono" text-anchor="end">07</text>
      <text x="28" y="113" font-size="30" fill="#edf7f7" font-weight="700" letter-spacing="-.8">守住下班自由</text>
      <text x="28" y="194" font-size="12" fill="#91a9b8" >游戏 / 塔防</text>
      <g transform="translate(440 115)">
        <g class="spin"><circle r="75" stroke="#74f8ce" stroke-opacity=".3" stroke-dasharray="66 20 8 85 24 268"/></g>
        <circle r="62" stroke="#d6fff2" stroke-opacity=".08"/>
        <g class="float" stroke="#74f8ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M0 45V-22M0 14Q-40 15-42-15Q-9-20 0 14ZM0 4Q39 3 41-25Q10-28 0 4Z"/><circle cy="-37" r="19"/><circle cx="-7" cy="-40" r="2"/><circle cx="7" cy="-40" r="2"/><path d="M-29 46H30" opacity=".35"/></g>
      </g>
      <path d="M28 223H532" stroke="url(#fade-line)" stroke-opacity=".3"/>
    
    <rect width="560" height="224" fill="url(#dust)" pointer-events="none"/>
  </g>
  <rect x=".5" y=".5" width="559" height="223" rx="23.5" stroke="#9be7d8" stroke-opacity=".14"/>
</svg>
