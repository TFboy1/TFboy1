<circle cx="473.3" cy="168.7" r="0.96" fill="#edf7f7" opacity="0.19"/>
      <path d="M330 1L290 223M347 1L307 223" stroke="#74f8ce" stroke-opacity=".04"/>
      <text x="28" y="33" font-size="10" fill="#74f8ce" class="mono" letter-spacing="1.4">PLAY / EXPLORE</text>
      <text x="532" y="33" font-size="11" fill="#91a9b8" class="mono" text-anchor="end">11</text>
      <text x="28" y="113" font-size="30" fill="#edf7f7" font-weight="700" letter-spacing="-.8">热梗精灵，冒险出发</text>
      <text x="28" y="194" font-size="12" fill="#91a9b8" >游戏 / 回合制肉鸽</text>
      <g transform="translate(440 115)">
        <g class="spin"><circle r="75" stroke="#74f8ce" stroke-opacity=".3" stroke-dasharray="66 20 8 85 24 268"/></g>
        <circle r="62" stroke="#d6fff2" stroke-opacity=".08"/>
        <g class="float" stroke="#74f8ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M-31-19L-39-47L-13-27Q0-33 13-27L39-47L31-19Q51 8 33 32Q0 53-33 32Q-51 8-31-19Z"/><circle cx="-16" cy="4" r="6"/><circle cx="16" cy="4" r="6"/><path d="M-11 26L0 19L11 26M-45 17L-55 31M45 17L55 31"/></g>
      </g>
      <path d="M28 223H532" stroke="url(#fade-line)" stroke-opacity=".3"/>
    
    <rect width="560" height="224" fill="url(#dust)" pointer-events="none"/>
  </g>
  <rect x=".5" y=".5" width="559" height="223" rx="23.5" stroke="#9be7d8" stroke-opacity=".14"/>
</svg>
