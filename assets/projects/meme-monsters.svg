<circle cx="357.6" cy="59.8" r="0.54" fill="#edf7f7" opacity="0.20" class="twinkle" style="animation-delay:-5.55s"/>
<circle cx="67.5" cy="149.9" r="0.97" fill="#edf7f7" opacity="0.50"/>
<circle cx="459.3" cy="69.5" r="0.90" fill="#edf7f7" opacity="0.38"/>
<circle cx="244.4" cy="25.9" r="1.70" fill="#74f8ce" opacity="0.54"/>
<circle cx="53.2" cy="137.9" r="1.20" fill="#edf7f7" opacity="0.63"/>
<circle cx="154.4" cy="30.3" r="1.52" fill="#edf7f7" opacity="0.17" class="twinkle" style="animation-delay:-3.38s"/>
<circle cx="60.9" cy="37.2" r="0.49" fill="#edf7f7" opacity="0.39"/>
<circle cx="516.9" cy="170.4" r="1.14" fill="#74f8ce" opacity="0.47"/>
