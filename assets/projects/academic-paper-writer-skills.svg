<circle cx="403.8" cy="111.4" r="0.69" fill="#edf7f7" opacity="0.24" class="twinkle" style="animation-delay:-1.36s"/>
<circle cx="106.0" cy="78.8" r="0.86" fill="#edf7f7" opacity="0.55"/>
<circle cx="128.4" cy="57.6" r="0.94" fill="#edf7f7" opacity="0.52"/>
<circle cx="394.6" cy="119.4" r="1.41" fill="#74f8ce" opacity="0.33"/>
<circle cx="142.0" cy="115.9" r="0.45" fill="#edf7f7" opacity="0.20"/>
<circle cx="386.2" cy="176.5" r="0.95" fill="#edf7f7" opacity="0.22" class="twinkle" style="animation-delay:-5.70s"/>
<circle cx="261.5" cy="81.3" r="0.55" fill="#edf7f7" opacity="0.32"/>
<circle cx="214.8" cy="67.3" r="1.17" fill="#74f8ce" opacity="0.37"/>
<circle cx="392.2" cy="107.9" r="1.39" fill="#edf7f7" opacity="0.29"/>
<circle cx="490.6" cy="136.8" r="1.66" fill="#edf7f7" opacity="0.22"/>
      <path d="M330 1L290 223M347 1L307 223" stroke="#74f8ce" stroke-opacity=".04"/>
      <text x="28" y="33" font-size="10" fill="#74f8ce" class="mono" letter-spacing="1.4">AI / AUTOMATION</text>
      <text x="532" y="33" font-size="11" fill="#91a9b8" class="mono" text-anchor="end">01</text>
      <text x="28" y="113" font-size="30" fill="#edf7f7" font-weight="700" letter-spacing="-.8">让论文整理成章</text>
      <text x="28" y="194" font-size="12" fill="#91a9b8" >AIGC / 论文</text>
