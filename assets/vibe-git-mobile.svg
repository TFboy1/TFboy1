<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Vibe-Git · 多 Agent 协作</title>
  <desc id="description">移动端协作示意图：人类意图通过 Vibe-Git 的共享上下文连接规划、构建和检查三个 Agent。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="600" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1722"/><stop offset=".5" stop-color="#080e17"/><stop offset="1" stop-color="#10242a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6fff2"/><stop offset=".45" stop-color="#74f8ce"/><stop offset="1" stop-color="#259b88"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
