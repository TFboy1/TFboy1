name: Refresh profile artwork

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/**"
      - "data/projects.json"
      - "package.json"
      - "README.md"

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check contribution data handling
        run: npm run test:data

      - name: Refresh the real GitHub contribution data
        run: npm run refresh

      - name: Build local profile images
        run: npm run build

      - name: Commit refreshed assets
        run: |
          git add assets data/github-contributions.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile contribution artwork"
          git pull --rebase origin main
          git push origin HEAD:main
